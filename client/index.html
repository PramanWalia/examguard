<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="ExamGuard — secure, server-timed online examinations." />
    <title>ExamGuard</title>
    <script>
      // Apply the saved theme before React mounts so the first paint does not flash.
      try {
        const saved = localStorage.getItem('examguard-theme');
        const dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch {
        // localStorage can be unavailable in strict privacy modes; light mode is a safe default.
      }
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
